<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc nghiệm vui cho Mẹ Hoà</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            backdrop-filter: blur(8px);
            background-color: rgba(0, 0, 0, 0.3);
            z-index: -1;
        }

        .quiz-container {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 380px;
            text-align: center;
            z-index: 10;
            position: relative;
        }

        h3 {
            margin-bottom: 20px;
            color: #333;
            font-size: 18px;
        }

        .options {
            text-align: left;
            margin-bottom: 20px;
        }

        .options label {
            display: block;
            background: #f8f9fa;
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            border: 1px solid #e9ecef;
        }

        .options label:hover {
            background: #e9ecef;
            border-color: #ced4da;
        }

        .options input {
            margin-right: 10px;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        button:hover {
            background: #4338ca;
        }

        #ketQua {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
        }
        
        .hidden {
            display: none !important;
        }

        /* Màn hình ăn mừng */
        #celebration-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
        }

        #celebration-screen h1 {
            font-size: 5rem;
            color: #ffD700;
            text-shadow: 0 0 20px #ff4500, 0 0 40px #ff0000;
            animation: bounce 1s infinite alternate;
            margin-bottom: 10px;
        }

        #celebration-screen p {
            font-size: 1.5rem;
            color: #fff;
            text-shadow: 0 0 10px #00ffff;
        }

        @keyframes bounce {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }
    </style>
</head>
<body>

    <div class="quiz-container" id="mainCard">
        <!-- CÂU HỎI 1 -->
        <div id="question1">
            <h3>Câu 1: Mẹ Hoà có béo không?</h3>
            <div class="options">
                <label><input type="radio" name="answer1" value="A"> A: có</label>
                <label><input type="radio" name="answer1" value="B"> B: không</label>
                <label><input type="radio" name="answer1" value="C"> C: bị mù không thấy gì cả</label>
                <label><input type="radio" name="answer1" value="D"> D: có thể</label>
            </div>
            <button type="button" onclick="kiemTraCau1()">Gửi đáp án</button>
        </div>

        <!-- CÂU HỎI 2 -->
        <div id="question2" class="hidden">
            <h3>Câu 2: Hôm nay nấu món ngon nhé mẹ?</h3>
            <div class="options">
                <label><input type="radio" name="answer2" value="A"> A. ok</label>
                <label><input type="radio" name="answer2" value="B"> B. không</label>
                <label><input type="radio" name="answer2" value="C"> C. ngày mai</label>
                <label><input type="radio" name="answer2" value="D"> D. ngày kia</label>
            </div>
            <button type="button" onclick="kiemTraCau2()">Gửi đáp án</button>
        </div>

        <div id="ketQua"></div>
    </div>

    <!-- MÀN HÌNH ĂN MỪNG -->
    <div id="celebration-screen" class="hidden">
        <h1>NGON 🎉</h1>
        <p>ngon hôm nay được ăn ngon rồi</p>
    </div>

    <canvas id="fireworksCanvas"></canvas>

    <script>
        function kiemTraCau1() {
            var luaChon = document.getElementsByName('answer1');
            var dapAnDaChon = "";
            
            for (var i = 0; i < luaChon.length; i++) {
                if (luaChon[i].checked) {
                    dapAnDaChon = luaChon[i].value;
                    break;
                }
            }
            
            var ketQuaDiv = document.getElementById("ketQua");

            if (dapAnDaChon === "") {
                ketQuaDiv.style.color = "#d97706";
                ketQuaDiv.innerText = "Vui lòng chọn một đáp án!";
            } else if (dapAnDaChon === "B") { // Đáp án đúng câu 1
                ketQuaDiv.style.color = "#16a34a";
                ketQuaDiv.innerText = "đúng";
                
                setTimeout(function() {
                    ketQuaDiv.innerText = "";
                    document.getElementById("question1").classList.add("hidden");
                    document.getElementById("question2").classList.remove("hidden");
                }, 1000);
            } else { // Các đáp án sai A, C, D của câu 1
                ketQuaDiv.style.color = "#dc2626";
                ketQuaDiv.innerText = "ồ";
            }
        }

        function kiemTraCau2() {
            var luaChon = document.getElementsByName('answer2');
            var dapAnDaChon = "";
            
            for (var i = 0; i < luaChon.length; i++) {
                if (luaChon[i].checked) {
                    dapAnDaChon = luaChon[i].value;
                    break;
                }
            }
            
            var ketQuaDiv = document.getElementById("ketQua");

            if (dapAnDaChon === "") {
                ketQuaDiv.style.color = "#d97706";
                ketQuaDiv.innerText = "Vui lòng chọn một đáp án!";
                return;
            }

            if (dapAnDaChon === "B") {
                ketQuaDiv.style.color = "#dc2626";
                ketQuaDiv.innerText = "không chọn lại đi mẹ";
            } else {
                if (dapAnDaChon === "A") {
                    ketQuaDiv.style.color = "#2563eb";
                    ketQuaDiv.innerText = "ngon";
                } else if (dapAnDaChon === "C") {
                    ketQuaDiv.style.color = "#16a34a";
                    ketQuaDiv.innerText = "ok";
                } else if (dapAnDaChon === "D") {
                    ketQuaDiv.style.color = "#9333ea";
                    ketQuaDiv.innerText = "ồ";
                }

                // Chuyển sang màn hình ăn mừng pháo hoa
                setTimeout(function() {
                    document.getElementById("mainCard").classList.add("hidden");
                    document.getElementById("celebration-screen").classList.remove("hidden");
                    batDauPhaoHoa();
                }, 1000);
            }
        }

        // Hiệu ứng pháo hoa
        function batDauPhaoHoa() {
            const canvas = document.getElementById("fireworksCanvas");
            const ctx = canvas.getContext("2d");

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let particles = [];

            class Particle {
                constructor(x, y, color) {
                    this.x = x;
                    this.y = y;
                    this.color = color;
                    this.angle = Math.random() * Math.PI * 2;
                    this.speed = Math.random() * 6 + 2;
                    this.friction = 0.95;
                    this.gravity = 0.1;
                    this.alpha = 1;
                    this.decay = Math.random() * 0.015 + 0.008;
                }

                update() {
                    this.speed *= this.friction;
                    this.x += Math.cos(this.angle) * this.speed;
                    this.y += Math.sin(this.angle) * this.speed + this.gravity;
                    this.alpha -= this.decay;
                }

                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.restore();
                }
            }

            function taoPhaoHoa() {
                const x = Math.random() * canvas.width;
                const y = Math.random() * (canvas.height / 2);
                const colors = ['#ff0000', '#00ff00', '#00ffff', '#ffff00', '#ff00ff', '#ffa500'];
                const color = colors[Math.floor(Math.random() * colors.length)];

                for (let i = 0; i < 80; i++) {
                    particles.push(new Particle(x, y, color));
                }
            }

            function animate() {
                ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                particles.forEach((particle, index) => {
                    particle.update();
                    particle.draw();
                    if (particle.alpha <= 0) {
                        particles.splice(index, 1);
                    }
                });

                requestAnimationFrame(animate);
            }

            animate();
            setInterval(taoPhaoHoa, 600);
        }
    </script>
</body>
</html>
